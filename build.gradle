plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '4.2.0'
}

group = 'com.zg.acelera'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    // Jackson 2 - mantido para compatibilidade com o código existente
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.4')
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Spring Boot BOM - gerenciamento das versões
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.2.0')

    // Spring Boot - API REST
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Spring Data JPA / Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Validação de dados
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Driver PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation platform('org.spockframework:spock-bom:2.5-groovy-5.0')
    testImplementation 'org.spockframework:spock-core'

    testImplementation 'org.apache.groovy:groovy'
}

test {
    useJUnitPlatform()
}


// Configurações locais
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}


// API de notificações Telegram
tasks.register('executarApiNotificacoesTelegram', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'br.com.zg.todolist.backend.telegram.InicializadorApiTelegram'

    if (localPropertiesFile.exists()) {
        environment 'TELEGRAM_BOT_TOKEN', localProperties.getProperty('TELEGRAM_BOT_TOKEN')
        environment 'TELEGRAM_CHAT_ID', localProperties.getProperty('TELEGRAM_CHAT_ID')
    }
}


// API de notificações e-mail
tasks.register('executarApiNotificacoesEmail', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'br.com.zg.todolist.backend.email.InicializadorApiEmail'

    if (localPropertiesFile.exists()) {
        environment([
                'TODO_EMAIL_API_TOKEN': localProperties.getProperty('TODO_EMAIL_API_TOKEN'),
                'RESEND_API_KEY': localProperties.getProperty('RESEND_API_KEY'),
                'TODO_EMAIL_FROM': localProperties.getProperty('TODO_EMAIL_FROM'),
                'TODO_EMAIL_TO': localProperties.getProperty('TODO_EMAIL_TO')
        ])
    }

    environment('TODO_EMAIL_ALLOWED_ORIGIN', '*')
}